name: Windows native crash capture
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Shared/Diagnostics/**'
      - 'Tests/NativeCapture/**'
      - '.github/workflows/native-capture.yml'
env:
  DIAGNOSTICS_SOURCE_REF: ${{ vars.DIAGNOSTICS_SOURCE_REF || '4629caff434e35312e8c99c776e364e392142d5d' }}
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate archive dependency pin
        shell: pwsh
        run: |
          if ($env:DIAGNOSTICS_SOURCE_REF -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Set DIAGNOSTICS_SOURCE_REF to the reviewed error-reporting commit SHA.'
          }
      - uses: actions/checkout@v4
        with:
          repository: CometWorks/error-reporting
          ref: ${{ env.DIAGNOSTICS_SOURCE_REF }}
          path: diagnostics-source
      - name: Build archive package
        shell: pwsh
        run: scripts/bootstrap-diagnostics.ps1 diagnostics-source/Diagnostics/CometWorks.Diagnostics.csproj
      - name: Compile native crash fixture
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'An x64 Visual C++ toolchain is required.' }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          cl /nologo /W4 /WX /Zi /Od /Fe:Tests/NativeCapture/native_crash.exe Tests/NativeCapture/native_crash.c
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture compilation failed.' }
      - name: Exercise native exception and consent withdrawal
        shell: pwsh
        run: |
          dotnet run --project Tests/NativeCapture/NativeCapture.csproj -c Release -- (Resolve-Path Tests/NativeCapture/native_crash.exe).Path
          if ($LASTEXITCODE -ne 0) { throw 'Native capture proof failed.' }
