name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - ".env.example"
      - "Directory.Build.props"
      - "LICENSE"
      - "NOTICE"
      - "Docs/Licensing.md"
      - "Docs/Installation.md"
      - "Dockerfile"
      - "NuGet.Config"
      - "Magnetar.Protocol/**"
      - "Quasar/**"
      - "Quasar.Peer/**"
      - "scripts/build-peer.py"
      - "Quasar.Agent/**"
      - "Quasar.Bootstrap/**"
      - "Quasar.Updater/**"
      - "Quasar.Host/**"
      - "Quasar.Host.Contract/**"
      - "Contracts/**"
      - "Shared/**"
      - "Quasar.sln"
      - "docker-compose.yml"
      - "install.sh"
      - "uninstall.sh"
      - "scripts/install.ps1"
      - "scripts/install-gui.*"
      - "scripts/Install.*"
      - "scripts/package-linux-release.sh"
      - "scripts/package-windows-release.ps1"
      - "scripts/package-symbols.py"
      - "scripts/cleanup-releases.py"
      - "scripts/test_cleanup_releases.py"
      - "scripts/readme-install-linux.md"
      - "scripts/readme-install-windows.md"
      - "scripts/uninstall.ps1"
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".dockerignore"
      - ".env.example"
      - "Directory.Build.props"
      - "LICENSE"
      - "NOTICE"
      - "Docs/Licensing.md"
      - "Docs/Installation.md"
      - "Dockerfile"
      - "NuGet.Config"
      - "Magnetar.Protocol/**"
      - "Quasar/**"
      - "Quasar.Peer/**"
      - "scripts/build-peer.py"
      - "Quasar.Agent/**"
      - "Quasar.Bootstrap/**"
      - "Quasar.Updater/**"
      - "Quasar.Host/**"
      - "Quasar.Host.Contract/**"
      - "Contracts/**"
      - "Shared/**"
      - "Quasar.sln"
      - "docker-compose.yml"
      - "install.sh"
      - "uninstall.sh"
      - "scripts/install.ps1"
      - "scripts/install-gui.*"
      - "scripts/Install.*"
      - "scripts/package-linux-release.sh"
      - "scripts/package-windows-release.ps1"
      - "scripts/package-symbols.py"
      - "scripts/cleanup-releases.py"
      - "scripts/test_cleanup_releases.py"
      - "scripts/readme-install-linux.md"
      - "scripts/readme-install-windows.md"
      - "scripts/uninstall.ps1"

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SE_DS_APPID: "298740"
  MAGNETAR_SDK_TAG: "v2.4.3.9"
  DIAGNOSTICS_SOURCE_REF: ${{ vars.DIAGNOSTICS_SOURCE_REF || '4629caff434e35312e8c99c776e364e392142d5d' }}

jobs:
  cleanup-pr-releases:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete closed PR draft releases
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/cleanup-releases.py --closed-pr "$PR_NUMBER"

  # Resolve the release identity once so the Linux and Windows builds stamp the
  # same version and all archives land under a single GitHub release/tag.
  metadata:
    # Draft PRs do not need release artifacts; skipping here cascades to every
    # downstream job via `needs`, so no build infra is spent until the PR is
    # marked ready for review. Non-PR events (push, tag, workflow_dispatch)
    # always run.
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
      draft: ${{ steps.release.outputs.draft }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release cleanup policy
        run: python3 -m unittest discover -s scripts -p test_cleanup_releases.py

      - name: Resolve Quasar release metadata
        id: release
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          # Single source of truth for the base version: Directory.Build.props.
          # Non-tag builds append a channel/run suffix to this base; tag pushes use
          # the tag name verbatim.
          base="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          if [[ -z "$base" ]]; then
            echo "Could not read <Version> from Directory.Build.props." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="v${version}"
            draft="false"
            prerelease="false"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${base}.${GITHUB_RUN_NUMBER}-manual"
            tag="v${version}"
            draft="true"
            prerelease="true"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # The build number (4th component) must reset to zero whenever the
            # base version (the first three components in Directory.Build.props)
            # changes. GITHUB_RUN_NUMBER cannot do this: it increments for the
            # lifetime of the workflow regardless of version bumps. Instead derive
            # the build number from git history by counting the commits since
            # <Version> was last set to its current value. The commit that bumped
            # the version yields build 0; each later commit increments by one.
            bump_commit=""
            while read -r sha; do
              v="$(git show "$sha:Directory.Build.props" 2>/dev/null \
                     | sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' | head -n1)"
              if [[ "$v" != "$base" ]]; then
                break
              fi
              bump_commit="$sha"
            done < <(git log --format=%H -- Directory.Build.props)

            if [[ -n "$bump_commit" ]]; then
              build="$(git rev-list --count "${bump_commit}..HEAD")"
            else
              build="$(git rev-list --count HEAD)"
            fi

            version="${base}.${build}"
            tag="v${version}"
            draft="false"
            prerelease="false"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$PR_NUMBER" ]]; then
              echo "Pull request number is not available." >&2
              exit 1
            fi
            version="${base}.${GITHUB_RUN_NUMBER}-pr.${PR_NUMBER}"
            tag="pr-${PR_NUMBER}/v${version}"
            draft="true"
            prerelease="true"
          else
            version="$(git rev-parse --short HEAD)"
            tag="$version"
            draft="true"
            prerelease="true"
          fi

          # The release is always named "Quasar v<version>" with no extra suffix.
          name="Quasar v${version}"

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "name=$name"
            echo "draft=$draft"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved release: tag=$tag version=$version draft=$draft prerelease=$prerelease"

      - name: Enforce 1.4.1 migration release prerequisite
        if: steps.release.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cleanup-releases.py --require-migration-release '${{ steps.release.outputs.version }}'

  build-linux:
    needs: metadata
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install packaging dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo add-apt-repository multiverse
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl lib32gcc-s1 p7zip-full

      - name: Probe Dedicated Server build id
        id: dsbuild
        run: |
          set -euo pipefail
          mkdir -p steamcmd
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar -xz -C steamcmd

          buildid=""
          for attempt in 1 2 3 4 5; do
            out="$(./steamcmd/steamcmd.sh +login anonymous +app_info_update 1 \
                     +app_info_print "$SE_DS_APPID" +quit 2>/dev/null || true)"
            buildid="$(printf '%s' "$out" | tr -d '\r' | awk '
              /"branches"/              { in_branches = 1 }
              in_branches && /"public"/ { in_public = 1 }
              in_public && /"buildid"/  { gsub(/[^0-9]/, "", $2); print $2; exit }
            ')"
            [ -n "$buildid" ] && break
            echo "Dedicated Server build id probe attempt $attempt empty; retrying..."
            sleep 5
          done

          if [ -z "$buildid" ]; then
            echo "WARNING: could not determine DS build id; DS cache will miss this run." >&2
            buildid="norev-${{ github.run_id }}"
          fi
          echo "Dedicated Server public build id: $buildid"
          echo "buildid=$buildid" >> "$GITHUB_OUTPUT"

      - name: Cache Dedicated Server libraries
        id: dscache
        uses: actions/cache@v4
        with:
          path: ds64
          key: ds64-linux-${{ steps.dsbuild.outputs.buildid }}

      - name: Install Space Engineers Dedicated Server references
        if: steps.dscache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p dsfull

          ./steamcmd/steamcmd.sh +quit || true

          ok=0
          for attempt in 1 2 3 4 5; do
            echo "SteamCMD install attempt $attempt/5"
            ./steamcmd/steamcmd.sh \
              +@sSteamCmdForcePlatformType windows \
              +force_install_dir "$PWD/dsfull" \
              +login anonymous \
              +app_update "$SE_DS_APPID" validate \
              +quit || true
            if [ -f "$PWD/dsfull/DedicatedServer64/SpaceEngineersDedicated.exe" ]; then
              ok=1
              break
            fi
            echo "SteamCMD attempt $attempt did not complete the DS install; retrying..."
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "ERROR: SteamCMD failed to install Space Engineers Dedicated Server references." >&2
            exit 1
          fi

          mkdir -p ds64
          cp -a "$PWD/dsfull/DedicatedServer64/." ds64/
          rm -rf dsfull
          echo "Cached DS library set:"; du -sh ds64

      - name: Install Magnetar PluginSdk reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/share/Magnetar"
          MAGNETAR_URL="$(python3 - <<'PY'
          import fnmatch
          import json
          import os
          import urllib.request

          # Authenticate the API call: unauthenticated requests to api.github.com are
          # capped at 60/hour per runner IP and intermittently fail with HTTP 403, so
          # use the workflow token (matches the build-windows gh api call).
          headers = {"User-Agent": "Quasar", "Accept": "application/vnd.github+json"}
          token = os.environ.get("GH_TOKEN", "")
          if token:
              headers["Authorization"] = f"Bearer {token}"
          req = urllib.request.Request(
              f"https://api.github.com/repos/CometWorks/magnetar/releases/tags/{os.environ['MAGNETAR_SDK_TAG']}",
              headers=headers,
          )
          with urllib.request.urlopen(req) as response:
              release = json.load(response)
          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("pinned Magnetar SDK release is not a full release")
          matches = [
              asset for asset in release.get("assets", [])
              if fnmatch.fnmatchcase(asset.get("name", ""), "MagnetarForLinux-*.7z")
          ]
          if len(matches) != 1:
              names = ", ".join(asset.get("name", "") for asset in release.get("assets", []))
              raise SystemExit(f"expected one MagnetarForLinux-*.7z asset, found {len(matches)}: {names}")
          print(matches[0]["browser_download_url"])
          PY
          )"
          curl -fL "$MAGNETAR_URL" -o /tmp/magnetar.7z
          7z x /tmp/magnetar.7z "-o$HOME/.local/share/Magnetar" -y
          PLUGIN_SDK="$(find "$HOME/.local/share/Magnetar" -type f -name "PluginSdk.dll" -print -quit)"
          if [ -z "$PLUGIN_SDK" ]; then
            echo "PluginSdk.dll not found in Magnetar archive" >&2
            exit 1
          fi
          echo "MagnetarBin=$(dirname "$PLUGIN_SDK")" >> "$GITHUB_ENV"

      - name: Validate diagnostic dependency pin
        run: |
          if [[ ! "$DIAGNOSTICS_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Set the DIAGNOSTICS_SOURCE_REF repository variable to the reviewed error-reporting commit SHA.' >&2
            exit 1
          fi

      - name: Checkout diagnostic archive source
        uses: actions/checkout@v4
        with:
          repository: CometWorks/error-reporting
          ref: ${{ env.DIAGNOSTICS_SOURCE_REF }}
          path: diagnostics-source

      - name: Build diagnostic archive package
        run: scripts/bootstrap-diagnostics.sh diagnostics-source/Diagnostics/CometWorks.Diagnostics.csproj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify browser SDK before packaging
        env:
          DS64: ${{ github.workspace }}/ds64
        run: |
          dotnet test Quasar.Tests/Quasar.Tests.csproj -c Release --filter "FullyQualifiedName~QuasarSdkTests|FullyQualifiedName~RbacAuthorizationTests|FullyQualifiedName~MachineEndpointSecurityTests|FullyQualifiedName~TrustedNetworkEvaluatorTests|FullyQualifiedName~HostedPanelTests|FullyQualifiedName~NativeConsoleKeepsLogSelection" --logger trx --results-directory artifacts/sdk-test-results
          node --test Quasar.Tests/browser-sdk.test.mjs Quasar.Tests/Browser/*.test.mjs

      - name: Retain SDK test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-tests-linux
          path: artifacts/sdk-test-results
          if-no-files-found: ignore

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: Quasar.Peer/go.sum

      - name: Package Linux release
        env:
          DS64: ${{ github.workspace }}/ds64
        run: scripts/package-linux-release.sh

      - name: Verify Linux installer archive root
        run: |
          set -euo pipefail
          roots="$(tar -tzf artifacts/linux/quasar-linux-x64.tar.gz | awk -F/ 'NF { print $1 }' | sort -u)"
          if [ "$roots" != "Quasar" ]; then
            echo "ERROR: expected quasar-linux-x64.tar.gz root directory to be Quasar; found: $roots" >&2
            exit 1
          fi
          expected="$(artifacts/linux/publish/Quasar --version)"
          actual="$(tar -xOzf artifacts/linux/quasar-linux-x64.tar.gz Quasar/release.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Package identity $actual differs from application identity $expected" >&2
            exit 1
          fi

      - name: Upload Linux archives
        uses: actions/upload-artifact@v4
        with:
          name: quasar-linux
          path: |
            artifacts/linux/quasar-linux-x64.tar.gz
            artifacts/linux/quasar-symbols-linux-x64.zip

  build-windows:
    needs: metadata
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Probe Dedicated Server build id
        id: dsbuild
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          New-Item -ItemType Directory -Force -Path steamcmd | Out-Null
          Invoke-WebRequest -Uri 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile steamcmd.zip
          Expand-Archive -Path steamcmd.zip -DestinationPath steamcmd -Force
          $steamcmd = Join-Path (Resolve-Path steamcmd).Path 'steamcmd.exe'

          $buildid = ''
          foreach ($attempt in 1..5) {
            $out = & $steamcmd +login anonymous +app_info_update 1 +app_info_print $env:SE_DS_APPID +quit 2>$null | Out-String
            $inBranches = $false
            $inPublic = $false
            foreach ($line in ($out -split "`n")) {
              if ($line -match '"branches"') { $inBranches = $true }
              if ($inBranches -and $line -match '"public"') { $inPublic = $true }
              if ($inPublic -and $line -match '"buildid"\s+"(\d+)"') { $buildid = $Matches[1]; break }
            }
            if ($buildid) { break }
            Write-Host "Dedicated Server build id probe attempt $attempt empty; retrying..."
            Start-Sleep -Seconds 5
          }

          if (-not $buildid) {
            Write-Warning "could not determine DS build id; DS cache will miss this run."
            $buildid = "norev-$env:GITHUB_RUN_ID"
          }
          Write-Host "Dedicated Server public build id: $buildid"
          "buildid=$buildid" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

          # steamcmd self-updates on first run and returns a non-zero exit code even
          # on success; the GitHub pwsh shell exits the step with $LASTEXITCODE, so
          # reset it explicitly now that we have the build id.
          exit 0

      - name: Cache Dedicated Server libraries
        id: dscache
        uses: actions/cache@v4
        with:
          path: ds64
          key: ds64-windows-${{ steps.dsbuild.outputs.buildid }}

      - name: Install Space Engineers Dedicated Server references
        if: steps.dscache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $steamcmd = Join-Path (Resolve-Path steamcmd).Path 'steamcmd.exe'
          New-Item -ItemType Directory -Force -Path dsfull | Out-Null
          $dsfull = (Resolve-Path dsfull).Path

          & $steamcmd +quit 2>$null | Out-Null

          $ok = $false
          foreach ($attempt in 1..5) {
            Write-Host "SteamCMD install attempt $attempt/5"
            # Native Windows depot; no +@sSteamCmdForcePlatformType override needed.
            & $steamcmd +force_install_dir $dsfull +login anonymous +app_update $env:SE_DS_APPID validate +quit
            if (Test-Path (Join-Path $dsfull 'DedicatedServer64\SpaceEngineersDedicated.exe')) { $ok = $true; break }
            Write-Host "SteamCMD attempt $attempt did not complete the DS install; retrying..."
            Start-Sleep -Seconds 5
          }
          if (-not $ok) {
            Write-Error "SteamCMD failed to install Space Engineers Dedicated Server references."
            exit 1
          }

          New-Item -ItemType Directory -Force -Path ds64 | Out-Null
          Copy-Item -Path (Join-Path $dsfull 'DedicatedServer64\*') -Destination ds64 -Recurse -Force
          Remove-Item -Recurse -Force dsfull
          $size = (Get-ChildItem -Recurse -Force ds64 | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Cached DS library set: {0:N1} MB" -f ($size / 1MB))

          # steamcmd can exit non-zero even after a successful install; the success
          # check above already validated the DS install, so do not let a stray
          # $LASTEXITCODE from steamcmd fail this step.
          exit 0

      - name: Install Magnetar PluginSdk reference
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $release = gh api "repos/CometWorks/magnetar/releases/tags/$env:MAGNETAR_SDK_TAG" | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) {
            throw "pinned Magnetar SDK release is not a full release"
          }
          $winAssets = @($release.assets | Where-Object { $_.name -like 'MagnetarForWindows-*.7z' })
          if ($winAssets.Count -ne 1) {
            $names = ($release.assets | ForEach-Object { $_.name }) -join ', '
            throw "expected one MagnetarForWindows-*.7z asset, found $($winAssets.Count): $names"
          }

          $magnetarRoot = Join-Path $env:APPDATA 'Magnetar'
          New-Item -ItemType Directory -Force -Path $magnetarRoot | Out-Null
          Invoke-WebRequest -Uri $winAssets[0].browser_download_url -OutFile magnetar.7z
          & 7z x magnetar.7z "-o$magnetarRoot" -y
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed with exit code $LASTEXITCODE" }

          $pluginSdk = Get-ChildItem -Path $magnetarRoot -Recurse -Filter PluginSdk.dll | Select-Object -First 1
          if (-not $pluginSdk) { throw "PluginSdk.dll not found in Magnetar archive" }
          "MagnetarBin=$($pluginSdk.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      # Pin ref to the reviewed diagnostics release commit when rolling out this stack.
      - name: Validate diagnostic dependency pin
        shell: pwsh
        run: |
          if ($env:DIAGNOSTICS_SOURCE_REF -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Set the DIAGNOSTICS_SOURCE_REF repository variable to the reviewed error-reporting commit SHA.'
          }

      - name: Checkout diagnostic archive source
        uses: actions/checkout@v4
        with:
          repository: CometWorks/error-reporting
          ref: ${{ env.DIAGNOSTICS_SOURCE_REF }}
          path: diagnostics-source

      - name: Build diagnostic archive package
        run: ./scripts/bootstrap-diagnostics.ps1 -DiagnosticsProject 'diagnostics-source/Diagnostics/CometWorks.Diagnostics.csproj'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify browser SDK before packaging
        shell: pwsh
        env:
          DS64: ${{ github.workspace }}/ds64
        run: |
          dotnet test Quasar.Tests/Quasar.Tests.csproj -c Release --filter "FullyQualifiedName~QuasarSdkTests|FullyQualifiedName~RbacAuthorizationTests|FullyQualifiedName~MachineEndpointSecurityTests|FullyQualifiedName~TrustedNetworkEvaluatorTests|FullyQualifiedName~HostedPanelTests|FullyQualifiedName~NativeConsoleKeepsLogSelection" --logger trx --results-directory artifacts/sdk-test-results
          if ($LASTEXITCODE -ne 0) { throw 'SDK server checks failed.' }
          $browserChecks = @('Quasar.Tests/browser-sdk.test.mjs') + @(Get-ChildItem 'Quasar.Tests/Browser/*.test.mjs' | ForEach-Object FullName)
          node --test @browserChecks
          if ($LASTEXITCODE -ne 0) { throw 'SDK browser checks failed.' }

      - name: Retain SDK test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-tests-windows
          path: artifacts/sdk-test-results
          if-no-files-found: ignore

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: Quasar.Peer/go.sum

      - name: Package Windows release
        shell: pwsh
        env:
          DS64: ${{ github.workspace }}\ds64
        run: scripts/package-windows-release.ps1

      - name: Verify Windows installer archive root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'artifacts/windows/quasar-win-x64.zip').Path)
          try {
            $roots = @(
              $zip.Entries |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_.FullName) } |
                ForEach-Object { ($_.FullName -replace '\\', '/').Split('/')[0] } |
                Sort-Object -Unique
            )
            $identityEntry = $zip.GetEntry('Quasar/release.json')
            $reader = [IO.StreamReader]::new($identityEntry.Open())
            try { $identity = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
          }
          finally {
            $zip.Dispose()
          }
          if ($roots.Count -ne 1 -or $roots[0] -ne 'Quasar') {
            throw "expected quasar-win-x64.zip root directory to be Quasar; found: $($roots -join ', ')"
          }

          $expected = & 'artifacts/windows/publish/Quasar.exe' --version
          if ($LASTEXITCODE -or $identity.version -ne $expected.Trim()) { throw 'Package release identity differs from application identity.' }

      - name: Upload Windows archives
        uses: actions/upload-artifact@v4
        with:
          name: quasar-windows
          path: |
            artifacts/windows/quasar-win-x64.zip
            artifacts/windows/quasar-symbols-win-x64.zip

  # Publish a single GitHub release/tag carrying every Linux and Windows archive
  # plus one combined SHA256SUMS. The updater finds the asset it needs by name,
  # so all platforms can share the same release.
  release:
    needs: [metadata, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble combined release files
        run: |
          set -euo pipefail
          mkdir -p release
          assets=(quasar-linux-x64.tar.gz quasar-win-x64.zip)
          for asset in "${assets[@]}"; do
            found="$(find dist -type f -name "$asset" -print -quit)"
            if [ -z "$found" ]; then
              echo "ERROR: expected release archive not found: $asset" >&2
              exit 1
            fi
            cp "$found" "release/$asset"
          done

          cd release
          sha256sum "${assets[@]}" > SHA256SUMS
          echo "Combined release archives:"; ls -1
          echo "Combined SHA256SUMS:"; cat SHA256SUMS

      - name: Publish combined release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.metadata.outputs.name }}
          draft: ${{ needs.metadata.outputs.draft }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          body: |
            ## Install Quasar

            Download the single archive for your operating system:

            | Operating system | Download |
            | --- | --- |
            | **Linux** (x64) | **`quasar-linux-x64.tar.gz`** |
            | **Windows** (x64) | **`quasar-win-x64.zip`** |

            The same full release is also published as
            `ghcr.io/cometworks/quasar:${{ needs.metadata.outputs.version }}` and
            `ghcr.io/cometworks/quasar:latest`. See the [Docker deployment guide](https://github.com/CometWorks/quasar/blob/main/Docs/Docker.md).

            Extract the platform archive and open **Install.cmd** (Windows UAC) or **Install.desktop** (Linux polkit). Choose **Manual install** for terminal commands and custom settings; `INSTALL.md` is bundled.

            Download the platform archive listed above. It contains one top-level `Quasar` folder with the unified **Quasar application**, native updater, Host, install/uninstall scripts, and a default `appsettings.json`. Existing Bootstrap or Scheduled Task installations must follow the [migration procedure](https://github.com/CometWorks/quasar/blob/main/Docs/QuasarUpdates.md#migrating-existing-installations). Follow the [Linux](https://github.com/CometWorks/quasar/blob/main/Docs/LinuxDeploymentAndUpdates.md) or [Windows](https://github.com/CometWorks/quasar/blob/main/Docs/WindowsDeploymentAndUpdates.md) deployment guide to install it. The web UI is available on http://127.0.0.1:8080 by default (the web server listens on all interfaces at 0.0.0.0:8080).

            Linux hosts need glibc 2.38 or newer (Debian 13, Ubuntu 24.04). On Debian and Ubuntu, install SteamCMD's 32-bit libraries and the CA certificates first: `sudo apt install ca-certificates lib32gcc-s1`. Quasar also needs the .NET 10 runtime, which `install.sh` offers to install. See the [prerequisites](https://github.com/CometWorks/quasar/blob/main/Docs/LinuxDeploymentAndUpdates.md#prerequisites).

            ## Browser SDK v1 (Quasar 1.6)

            Plugin and built-in analytics/log operations share protected JSON, streaming and subscription APIs. Security offers endpoint policy overrides. Existing stored `policyOverrides` now take effect: review and back up `rbac.json` before upgrading. Entity Viewer 0.1.13 requires Quasar 1.6.0 or newer; upgrade Quasar first, then the viewer adapter/assets and companion. Existing panel URLs remain unchanged. This release uses the current HTTP transport; WebRTC is a later rollout. See [SDK rollout and rollback](https://github.com/CometWorks/quasar/blob/main/Docs/BrowserSdkRollout.md).

            ## Platform packages

            This release provides only the two complete platform packages. Legacy `quasar-web-*` assets remain exclusively on the retained full 1.4.1 migration release; normal updates use the complete platform package. Each platform archive includes the unified **Quasar application**, **native updater**, **Host** and installers. Legacy launcher asset names are deliberately absent so old Bootstrap versions cannot self-activate the new layout. Use **Update Quasar** or `Quasar update --version <version>` for coordinated, checksum-verified activation. Hosts are included in each platform package; debug symbols remain CI artifacts.

            ### Required upgrade order

            **Complete and successfully start the full Quasar 1.4.1 migration package before 1.5 or later.** Updating only a legacy web worker does not complete migration. The application, updater, CLI and installer enforce this prerequisite. Follow the [migration guide](https://github.com/CometWorks/quasar/blob/main/Docs/QuasarUpdates.md#required-141-migration-before-15).
          files: |
            release/*

      - uses: actions/checkout@v4

      - name: Prune older releases and closed PR drafts
        env:
          CURRENT_TAG: ${{ needs.metadata.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cleanup-releases.py --current-tag "$CURRENT_TAG"

  publish-container:
    needs: [metadata, release]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.metadata.outputs.draft == 'false' &&
      needs.metadata.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish Quasar image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          provenance: false
          build-args: |
            QUASAR_VERSION=${{ needs.metadata.outputs.version }}
          tags: |
            ghcr.io/cometworks/quasar:${{ needs.metadata.outputs.version }}
            ghcr.io/cometworks/quasar:v${{ needs.metadata.outputs.version }}
            ghcr.io/cometworks/quasar:latest
          labels: |
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=quasar-container
          cache-to: type=gha,mode=max,scope=quasar-container

      - name: Verify anonymous image pull
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker buildx imagetools inspect \
            "ghcr.io/cometworks/quasar:${{ needs.metadata.outputs.version }}"
